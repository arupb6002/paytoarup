<!DOCTYPE html>
<html>
<head>
<title>Success</title>

<style>
body {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#e8f5e9;
  font-family:Arial;
}
.box {
  text-align:center;
}
.tick {
  font-size:80px;
  color:green;
}
</style>
</head>

<body>

<div class="box">
<div class="tick">✔</div>
<h2>Payment Successful</h2>
<p id="pid"></p>
</div>

<script>
let params = new URLSearchParams(window.location.search);
document.getElementById("pid").innerText =
  "Payment ID: " + params.get("pid");
</script>

</body>
</html>
